services:
  postgres:
    image: postgres:16-alpine
    container_name: esperanca-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campanha_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: esperanca-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: esperanca-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  campanha-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esperanca-campanha-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CampanhaDb: "Host=postgres;Port=5432;Database=campanha_db;Username=postgres;Password=postgres"
      ConnectionStrings__DoacoesMongo: "mongodb://mongo:27017"
      Jwt__SecretKey: "SuperSecretKey-ParaDesenvolvimento-MinimoDE32Chars!"
      Jwt__Issuer: "esperanca-campanha-api"
      Jwt__Audience: "esperanca-platform"
      Jwt__AccessTokenExpirationMinutes: "30"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__User: "guest"
      RabbitMq__Password: "guest"
    ports:
      - "5010:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
