services:
  postgres:
    image: postgres:16-alpine
    container_name: esperanca-campanha-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: esperanca-campanha-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: esperanca-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  campanhas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esperanca-campanhas-api
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__CampanhaDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__DoacoesMongo: mongodb://mongo:27017

      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: esperanca-identity-api
      Jwt__Audience: esperanca-platform
      Jwt__AccessTokenExpirationMinutes: 30

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: /
      RabbitMq__Exchange: esperanca.doacoes
      RabbitMq__DeadLetterExchange: esperanca.doacoes.dlx
      RabbitMq__RecebidaQueue: doacoes-recebidas
      RabbitMq__RecebidaRoutingKey: recebida
      RabbitMq__RecebidaDeadLetterQueue: doacoes-recebidas-dlq
      RabbitMq__ProcessadaQueue: doacoes-processadas
      RabbitMq__ProcessadaRoutingKey: processada
      RabbitMq__ProcessadaDeadLetterQueue: doacoes-processadas-dlq
      RabbitMq__PrefetchCount: 1
    ports:
      - "5046:8080"

volumes:
  postgres_data:
  mongo_data: