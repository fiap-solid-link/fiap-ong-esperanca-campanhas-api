services:
  postgres-campanhas:
    image: postgres:16-alpine
    container_name: esperanca-postgres-campanhas
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campanhas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_campanhas_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: esperanca-rabbitmq
    ports:
      - "5672:5672"   # Porta onde a API envia as mensagens
      - "15672:15672" # Porta do painel visual no navegador

volumes:
  postgres_campanhas_data: